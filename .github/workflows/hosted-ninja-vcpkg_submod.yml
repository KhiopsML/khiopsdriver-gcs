#
# The peculiarity of this workflow is that assumes vcpkg stored as a submodule of this repository.
# The workflow runs on x64 and ARM platforms.
# Workflow steps:
# - Setup vcpkg and cache it on the GitHub Action cloud based cache.
# - Runs CMake with CMakePreset.json using a presest configuration
#   that leverages the vcpkg's toolchain file. This will automatically run vcpkg 
#   to install dependencies described by the vcpkg.json manifest file. 
#   This stage also runs vcpkg with Binary Caching leveraging GitHub Action cache to 
#   store the built packages artifacts, hence it will be a no-op if those are restored 
#   from cache (e.g., already previously built).
# - Finally builds the sources with Ninja, and tests as well.
name: hosted-ninja-vcpkg_submod-autocache
on:
  workflow_dispatch:
  push: 
  # pull_request:
  #   branches: 
  #   - v11
  #   - main

jobs:
  job:
    name: ${{ matrix.os }}-${{ github.workflow }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, triplet: x64-linux}
          - {os: macos-latest, triplet: arm64-osx}
          - {os: macos-15-intel, triplet: x64-osx}
          - {os: macos-14, triplet: arm64-osx}
          - {os: windows-latest, triplet: x64-windows}
    defaults:
      run:
        shell: bash
    permissions:
      contents: 'read'
      id-token: 'write'
      issues: 'write'
    env:
    #
    # [OPTIONAL] Define the vcpkg's triplet 
    # you want to enforce, otherwise the default one 
    # for the hosting system will be automatically
    # choosen (x64 is the default on all platforms, 
    # e.g. x64-osx).
      VCPKG_DEFAULT_TRIPLET: ${{ matrix.triplet }}
      # We can define the prefix here as, opposed to the Azure driver worflow, it will not change between testing steps.
      STORAGE_DRIVER_TEST_URL_PREFIX: gs://data-test-khiops-driver-gcs

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: lukka/get-cmake@v3.30.3

      - name: Restore from cache and setup vcpkg executable and data files.
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: 'vcpkg.json'

      # Retrieve google credentials through WIF - needed to run tests
      # see https://github.com/google-github-actions/auth?tab=readme-ov-file#workload-identity-federation-through-a-service-account
      - uses: google-github-actions/auth@v2
        with:
          service_account: 'khiops-gcs-driver-test-sa@ino-olr-dak-ideal-sbx.iam.gserviceaccount.com'
          workload_identity_provider: 'projects/322269704080/locations/global/workloadIdentityPools/github/providers/my-repo'

      - name: Install coverage tools
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install lcov gcovr
  
      # Note: if the preset misses the "configuration", it is possible to explicitly select the
      # configuration with the additional `--config` flag, e.g.:
      #   buildPreset: 'ninja-vcpkg'
      #   buildPresetAdditionalArgs: "[`--config`, `Release`]"
      #   testPreset: 'ninja-vcpkg'
      #   testPresetAdditionalArgs: "[`--config`, `Release`]"
      - name: Build debug version and run sanitizer checks.
        if: matrix.os == 'ubuntu-latest'
        uses: lukka/run-cmake@v10
        with:
          configurePreset: 'ninja-dbg'
          configurePresetAdditionalArgs: '["-DBUILD_TESTS=ON"]'
          buildPreset: 'ninja-dbg'
          testPreset: 'ninja-dbg'
        env:
          CTEST_PARALLEL_LEVEL: ''

      - name: Generate coverage reports
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        run: |
          find build/ninja-dbg -name '*.gcda' -delete
          export GCOV=gcov
          cmake --build --preset ninja-dbg --target khiops-gcs_coverage_unit --target khiops-gcs_cobertura_unit --target khiops-gcs_coverage_full --target khiops-gcs_cobertura_full

      - name: Detect generated coverage reports
        id: coverage_probe
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -euo pipefail

          unit_ready=false
          full_ready=false

          if [[ -f build/ninja-dbg/coverage-unit/index.html && -f build/ninja-dbg/coverage-unit.xml ]]; then
            unit_ready=true
          fi

          if [[ -f build/ninja-dbg/coverage-full/index.html && -f build/ninja-dbg/coverage-full.xml ]]; then
            full_ready=true
          fi

          echo "unit_ready=${unit_ready}" >> "$GITHUB_OUTPUT"
          echo "full_ready=${full_ready}" >> "$GITHUB_OUTPUT"

          echo "Coverage probe summary: unit_ready=${unit_ready}, full_ready=${full_ready}"

      - name: Coverage unit upload skipped
        if: matrix.os == 'ubuntu-latest' && steps.coverage_probe.outputs.unit_ready != 'true'
        run: |
          echo "Skipping unit coverage upload: expected files not generated (build/ninja-dbg/coverage-unit/index.html, build/ninja-dbg/coverage-unit.xml)."

      - name: Coverage full upload skipped
        if: matrix.os == 'ubuntu-latest' && steps.coverage_probe.outputs.full_ready != 'true'
        run: |
          echo "Skipping full coverage upload: expected files not generated (build/ninja-dbg/coverage-full/index.html, build/ninja-dbg/coverage-full.xml)."

      - name: Upload coverage results (unit)
        if: matrix.os == 'ubuntu-latest' && steps.coverage_probe.outputs.unit_ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit-${{ matrix.os }}
          path: |
            build/ninja-dbg/coverage-unit/**
            build/ninja-dbg/coverage-unit.xml
          if-no-files-found: error

      - name: Upload coverage results (full)
        if: matrix.os == 'ubuntu-latest' && steps.coverage_probe.outputs.full_ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-full-${{ matrix.os }}
          path: |
            build/ninja-dbg/coverage-full/**
            build/ninja-dbg/coverage-full.xml
          if-no-files-found: error

      - name: Coverage summary
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -euo pipefail

          unit_status="${{ steps.coverage_probe.outputs.unit_ready }}"
          full_status="${{ steps.coverage_probe.outputs.full_ready }}"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          {
            echo "## Coverage Report"
            echo ""
            echo "- Unit coverage generated: ${unit_status}"
            echo "- Full coverage generated: ${full_status}"
            echo "- Workflow run: ${run_url}"
            echo ""
            echo "### Expected Artifact Names"
            echo "- coverage-unit-${{ matrix.os }}"
            echo "- coverage-full-${{ matrix.os }}"
            echo ""
            echo "### Report Paths"
            if [[ "${unit_status}" == "true" ]]; then
              echo "- Unit HTML: build/ninja-dbg/coverage-unit/index.html"
              echo "- Unit XML: build/ninja-dbg/coverage-unit.xml"
            else
              echo "- Unit report not generated"
            fi

            if [[ "${full_status}" == "true" ]]; then
              echo "- Full HTML: build/ninja-dbg/coverage-full/index.html"
              echo "- Full XML: build/ninja-dbg/coverage-full.xml"
            else
              echo "- Full report not generated"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment coverage status on PR
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          UNIT_READY: ${{ steps.coverage_probe.outputs.unit_ready }}
          FULL_READY: ${{ steps.coverage_probe.outputs.full_ready }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const marker = '<!-- coverage-report-status -->';
            const unitReady = process.env.UNIT_READY === 'true';
            const fullReady = process.env.FULL_READY === 'true';
            const runUrl = process.env.RUN_URL;

            const lines = [
              marker,
              '## Coverage Report',
              '',
              `- Unit coverage generated: ${unitReady ? 'true' : 'false'}`,
              `- Full coverage generated: ${fullReady ? 'true' : 'false'}`,
              `- Workflow run: ${runUrl}`,
              '',
              'Artifacts (if generated):',
              `- coverage-unit-${{ matrix.os }}`,
              `- coverage-full-${{ matrix.os }}`,
              '',
              unitReady
                ? '- Unit report: `build/ninja-dbg/coverage-unit/index.html` and `build/ninja-dbg/coverage-unit.xml`'
                : '- Unit report skipped or not generated.',
              fullReady
                ? '- Full report: `build/ninja-dbg/coverage-full/index.html` and `build/ninja-dbg/coverage-full.xml`'
                : '- Full report skipped or not generated.'
            ];

            const body = lines.join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

      - name: Run CMake+vcpkg+Ninja+CTest to build packages and generate/build/test the code.
        uses: lukka/run-cmake@v10
        with:
          configurePreset: 'ninja-rel'
          configurePresetAdditionalArgs: '["-DBUILD_TESTS=ON"]'
          buildPreset: 'ninja-rel'
          testPreset: 'ninja-rel'
          testPresetAdditionalArgs: '["--output-junit", "test_results.xml"]'
        env:
          CTEST_PARALLEL_LEVEL: ''

      - name: Upload results of cloud storage tests
        if: always()
        uses: test-summary/action@v2
        with:
          paths: ${{ github.workspace }}/build/release/test_results.xml
  
      - name: Upload the packages as artifacts
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.os }}
          path: |
            build/release/lib/*.dylib
            build/release/lib/*.so
            build/release/bin/*.dll
            build/release/bin/*.lib
          if-no-files-found: ignore
